[package]
name = "kova-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Write-ahead log, mmap vector store, and metadata index for Kova."

[dev-dependencies]
tempfile = "3"

[dependencies]
kova-core = { path = "../kova-core" }
kova-index = { path = "../kova-index" }
thiserror.workspace = true
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1"
memmap2 = "0.9"
bytemuck = "1"

[lints]
workspace = true
