[package]
name = "kova-query"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "KQL : query language for Kova. Parser, binder, planner, executor."

[dependencies]
kova-core = { path = "../kova-core" }
kova-storage = { path = "../kova-storage" }
kova-meta-index = { path = "../kova-meta-index" }
roaring = "0.10"
thiserror.workspace = true
pest = "2"
pest_derive = "2"

[features]
# Exposes plan A/B/C builders and Engine::execute_plan for the
# cost model validation example. Off in normal builds.
internal-bench = []

[dev-dependencies]
kova-index = { path = "../kova-index" }
tempfile = "3"
rand = "0.10"
criterion = "0.5"

[[bench]]
name = "meta_index"
harness = false

[[example]]
name = "validate_cost_model"
required-features = ["internal-bench"]

[lints]
workspace = true
